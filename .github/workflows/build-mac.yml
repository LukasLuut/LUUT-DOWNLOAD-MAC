name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # attach the .dmg files to the GitHub Release when a v* tag is pushed

jobs:
  build:
    # Apple Silicon only: the official yt-dlp_macos no longer runs on Intel Macs (its x86_64 slice is just a launcher).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build .app and .dmg
        env:
          PYTHON: python
        run: bash build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LuutVideoDownloader-macOS-${{ runner.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
